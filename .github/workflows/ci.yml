name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit standalone
        run: |
          curl -sSL -o junit.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile main sources
        run: |
          mkdir -p build/main build/test
          javac -d build/main $(find src/main/java -name '*.java')

      - name: Compile test sources
        run: javac -cp "build/main:junit.jar" -d build/test $(find src/test/java -name '*.java')

      - name: Run tests
        run: java -cp "build/main:build/test:junit.jar" org.junit.platform.console.ConsoleLauncher --scan-class-path build/test

      - name: Smoke test the demo
        run: java -cp "build/main" quill.examples.Demo

      - name: Smoke test the CLI
        run: java -cp "build/main" quill.cli.Main version
